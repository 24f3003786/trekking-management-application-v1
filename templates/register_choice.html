<!DOCTYPE html>
<html lang="en">

<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div id="main">
        <div id="canvas">

            <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="/">Trekking Management</a>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/">Home</a>
                        <a class="nav-link" href="/login">Login</a>
                        <a class="nav-link active" href="/register-choice">Register</a>
                    </div>
                </div>
            </nav>

            <div id="form-body" style="height:auto; margin-top:160px; padding:35px;">
                <h2 class="login-heading text-center">Register As</h2>
                <p class="text-center text-muted mb-4">Choose the type of account you want to create</p>

                <div class="d-flex flex-column gap-3">
                    <a href="/register/trekker" class="btn btn-outline-primary btn-lg">Trekker</a>
                    <a href="/register/trek_staff" class="btn btn-outline-primary btn-lg">Trek Staff</a>
                </div>

                <div class="text-center mt-4">
                    <small>Already have an account? <a href="/login">Login</a></small>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
