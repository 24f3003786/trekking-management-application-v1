<!DOCTYPE html>
<html lang="en">

<head>
    <title>Edit Trek</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #form-body {
            width: 900px;
            height: auto;
            margin-top: 30px;
            border-radius: 20px;
            padding: 30px;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="canvas">

            <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="/admin/dashboard">Trekking Management</a>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/admin/dashboard">Dashboard</a>
                        <a class="nav-link active" href="/admin/treks">Treks</a>
                        <a class="nav-link" href="/admin/staff">Staff</a>
                        <a class="nav-link" href="/admin/users">Users</a>
                        <a class="nav-link" href="/admin/bookings">Bookings</a>
                        <a class="nav-link" href="/logout">Logout</a>
                    </div>
                </div>
            </nav>

            <div id="form-body", style= "max-height: 600px; overflow-y: auto;">
                <h2 class="login-heading text-center">Edit Trek</h2>
                <br>

                {% with messages = get_flashed_messages(with_categories=True) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('edit_trek', trek_id=trek.id) }}" method="POST">

                    <div class="row">

                        <!-- Left Column -->
                        <div class="col-md-6">

                            <div class="mb-3">
                                <label class="form-label">Trek Name</label>
                                <input type="text" class="form-control" name="trek_name" value="{{ trek.trek_name }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Difficulty</label>
                                <select class="form-select" name="difficulty" required>
                                    <option value="">-- Select Difficulty --</option>
                                    <option {% if trek.difficulty == "Easy" %}selected{% endif %}>Easy</option>
                                    <option {% if trek.difficulty == "Moderate" %}selected{% endif %}>Moderate</option>
                                    <option {% if trek.difficulty == "Difficult" %}selected{% endif %}>Difficult</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Duration (Days)</label>
                                <input type="number" class="form-control" name="duration" value="{{ trek.duration }}" min="1" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Available Slots</label>
                                <input type="number" class="form-control" name="available_slots" value="{{ trek.available_slots }}" min="0" required>
                            </div>

                        </div>

                        <!-- Right Column -->
                        <div class="col-md-6">

                            <div class="mb-3">
                                <label class="form-label">Trek Status</label>
                                <select class="form-select" name="status" required>
                                    <option value="">-- Select Status --</option>
                                    <option {% if trek.trek_status == "Open" %}selected{% endif %}>Open</option>
                                    <option {% if trek.trek_status == "Closed" %}selected{% endif %}>Closed</option>
                                    <option {% if trek.trek_status == "Completed" %}selected{% endif %}>Completed</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" name="start_date" value="{{ trek.start_date | string }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">End Date</label>
                                <input type="date" class="form-control" name="end_date" value="{{ trek.end_date | string }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Assign Staff</label>
                                <select class="form-select" name="staff_id">
                                    <option value="">-- No Staff Assigned --</option>
                                    {% for staff in approved_staff %}
                                    <!--
                                        trek.staff_id is the currently assigned staff's primary key.
                                        We compare it to staff.id for each option in the loop.
                                        If they match, that option gets `selected` — showing who
                                        is currently assigned when the edit form loads.
                                    -->
                                    <option value="{{ staff.id }}"
                                        {% if trek.staff_id == staff.id %}selected{% endif %}>
                                        {{ staff.user.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" name="description"
                                          rows="3">{{ trek.description or '' }}</textarea>
                            </div>

                        </div>

                    </div>

                    <div class="text-end mt-3">
                        <a href="/admin/treks" class="btn btn-secondary me-2">Cancel</a>
                        <input type="submit" class="btn btn-primary" value="Save Changes">
                    </div>

                </form>
            </div>

        </div>
    </div>
</body>
</html>
