<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #form-body {
            width: 600px;
            height: auto;
            margin-top: 50px;
            border-radius: 20px;
            padding: 30px;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="canvas">

            <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="/trek_staff/dashboard/{{ user.id }}">Trekking Management Application</a>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/trek_staff/dashboard/{{ user.id }}">Dashboard</a>
                        <a class="nav-link active" href="/trek_staff/profile/{{ user.id }}">Profile</a>
                        <a class="nav-link" href="/logout">Logout</a>
                    </div>
                </div>
            </nav>

            <div id="form-body">
                <h2 class="text-center mb-4">My Profile</h2>

                {% with messages = get_flashed_messages(with_categories=True) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('staff_profile', user_id=user.id) }}" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" value="{{ user.email }}" disabled>
                        <div class="form-text">Email can't be changed here.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" name="phone" value="{{ user.phone }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Leave blank to keep current password">
                    </div>

                    <div class="text-end">
                        <a href="/trek_staff/dashboard/{{ user.id }}" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</body>
</html>
